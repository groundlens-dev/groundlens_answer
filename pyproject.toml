[project]
name = "groundlens_answer"
version = "0.1.0"
description = "Validates that the figures in an LLM answer are supported by the passages it was written from, without a model."
authors = [
    {name = "Javier Marin", email = "javier@groundlens.dev"}
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    "guardrails-ai>=0.5.0",
    "groundlens>=6.0.1,<7"
]

[project.optional-dependencies]
dev = [
    "pyright",
    "pytest",
    "ruff"
] 

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-rP"
testpaths = [
    "tests"
]

[tool.pyright]
include = ["validator"]